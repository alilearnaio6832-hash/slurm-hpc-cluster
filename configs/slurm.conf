# Slurm configuration for the containerized lab cluster.
# Same file is mounted read-only into every container.

ClusterName=lab-hpc
SlurmctldHost=slurmctld

SlurmUser=slurm
AuthType=auth/munge
MpiDefault=none

# Directories (logs go to stderr -> visible with `docker compose logs`)
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

# Containers have no usable cgroup hierarchy for Slurm by default,
# so use the simple process tracker and no task plugin.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none

# Scheduling: allocate individual cores and memory (not whole nodes)
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
DefMemPerCPU=250
GresTypes=gpu
PriorityType=priority/basic

ReturnToService=2
SlurmctldTimeout=30
SlurmdTimeout=60

# Compute nodes. Values must not exceed the real hardware of your Docker host;
# check with: docker compose exec c1 slurmd -C
NodeName=c1 CPUs=2 Sockets=1 CoresPerSocket=2 ThreadsPerCore=1 RealMemory=1000 Gres=gpu:1 State=UNKNOWN
NodeName=c2 CPUs=2 Sockets=1 CoresPerSocket=2 ThreadsPerCore=1 RealMemory=1000 State=UNKNOWN

PartitionName=cpu Nodes=c[1-2] Default=YES MaxTime=INFINITE State=UP
PartitionName=gpu Nodes=c1 MaxTime=INFINITE State=UP
