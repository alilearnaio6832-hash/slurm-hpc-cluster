name: slurm-lab

x-slurm-node: &slurm-node
  build: ./docker
  image: slurm-lab:latest
  restart: unless-stopped
  volumes:
    - ./configs/slurm.conf:/etc/slurm/slurm.conf:ro
    - ./configs/gres.conf:/etc/slurm/gres.conf:ro
    - ./jobs:/jobs:ro
    - shared:/shared

services:
  slurmctld:
    <<: *slurm-node
    hostname: slurmctld
    environment:
      ROLE: controller

  c1:
    <<: *slurm-node
    hostname: c1
    environment:
      ROLE: compute
      NODE_NAME: c1
    depends_on:
      - slurmctld
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  c2:
    <<: *slurm-node
    hostname: c2
    environment:
      ROLE: compute
      NODE_NAME: c2
    depends_on:
      - slurmctld

volumes:
  shared:
