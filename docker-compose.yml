name: slurm-lab

x-slurm-node: &slurm-node
  build: ./docker
  image: slurm-lab:latest
  restart: unless-stopped
  volumes:
    - ./configs/slurm.conf:/etc/slurm/slurm.conf:ro
    - ./configs/gres.conf:/etc/slurm/gres.conf:ro
    - ./jobs:/jobs:ro
    - shared:/shared

services:
  slurmctld:
    <<: *slurm-node
    hostname: slurmctld
    environment:
      ROLE: controller

  c1:
    <<: *slurm-node
    hostname: c1
    environment:
      ROLE: compute
      NODE_NAME: c1
    depends_on:
      - slurmctld
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  c2:
    <<: *slurm-node
    hostname: c2
    environment:
      ROLE: compute
      NODE_NAME: c2
    depends_on:
      - slurmctld

  slurm-exporter:
    <<: *slurm-node
    hostname: slurm-exporter
    environment:
      ROLE: exporter
    ports:
      - "127.0.0.1:19500:9500"
    volumes:
      - ./configs/slurm.conf:/etc/slurm/slurm.conf:ro
      - ./monitoring:/monitoring:ro
    depends_on:
      - slurmctld

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:29090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - slurm-exporter

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:23000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  shared:
  prometheus_data:
  grafana_data:
